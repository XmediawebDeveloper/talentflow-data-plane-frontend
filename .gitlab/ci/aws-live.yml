# =============================================================================
# AWS Live — frontend deploy to the AWS EC2 instance
#
# Trigger: merge `production` → `aws_live`. Pushes to `production` run nothing.
#
#   Check ─► Build ─► Push (ECR) ─► Deploy (SSH) ─► Health check (auto-rollback)
#
# The runner (common-vm-runner, shell executor, local server) builds the image
# and pushes it to AWS ECR. The EC2 instance never builds — it only pulls the
# image and restarts the frontend container. The backend containers on the
# same instance are not touched.
#
# GitLab CI/CD variables (Settings → CI/CD → Variables, protected):
#   AWS_RUNNER_TAG          tag of common-vm-runner (default below)
#   AWS_ACCESS_KEY_ID       IAM user with ECR push rights          (masked)
#   AWS_SECRET_ACCESS_KEY                                           (masked)
#   AWS_REGION              e.g. ap-south-1
#   ECR_REGISTRY            <account-id>.dkr.ecr.<region>.amazonaws.com
#   AWS_SERVER_HOST         EC2 public IP / hostname
#   AWS_SERVER_USER         SSH user, e.g. ubuntu
#   AWS_SSH_KEY             EC2 private key (.pem) — type "File"
#   FRONTEND_ENV            type "File", environment "aws_live" — a .env with
#                           all NEXT_PUBLIC_* values (baked in at build time).
#                           Or set each NEXT_PUBLIC_* as its own variable.
#
# EC2 one-time setup:
#   - Docker + compose plugin installed, SSH user in the `docker` group
#   - sudo mkdir -p /opt/talentflow/frontend && sudo chown $USER /opt/talentflow/frontend
#   - /opt/talentflow/frontend/.env (runtime server-side vars; may be empty)
#
# NOTE: the build needs ~8GB RAM on the runner (NODE_OPTIONS in the Dockerfile).
# =============================================================================

variables:
  AWS_RUNNER_TAG: common-vm-runner
  AWS_ECR_REPO: talentflow-frontend
  AWS_DEPLOY_DIR: /opt/talentflow/frontend

.aws-live:
  tags: [$AWS_RUNNER_TAG]
  rules:
    - if: '$CI_COMMIT_BRANCH == "aws_live"'

# aws CLI via its container, so the runner needs only docker
.aws-cli: &aws-cli
  - aws() { docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION="$AWS_REGION" amazon/aws-cli:2.17.0 "$@"; }

.ssh: &ssh
  # normalise the pasted key: CRLF, indentation and a missing final newline
  # all make ssh fail with "error in libcrypto"
  - printf '%s\n' "$(tr -d '\r' < "$AWS_SSH_KEY" | sed 's/^[[:space:]]*//')" > "$AWS_SSH_KEY.pem"
  - chmod 600 "$AWS_SSH_KEY.pem"
  - SSH_OPTS="-i $AWS_SSH_KEY.pem -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
  - SSH_TARGET="$AWS_SERVER_USER@$AWS_SERVER_HOST"

# Lint is advisory, same as the existing "Code style (advisory)" job —
# type errors are still caught by `next build` in the Build stage.
"Check":
  extends: .aws-live
  stage: check
  script:
    - docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/.npm
        -v "$CI_PROJECT_DIR:/src" -w /src node:22-alpine
        sh -c "npm ci --no-audit --no-fund && npx eslint ."
  allow_failure: true

"Build":
  extends: .aws-live
  stage: build
  environment:
    name: aws_live
    action: prepare   # pulls in the aws_live-scoped NEXT_PUBLIC_* values
  script:
    # All NEXT_PUBLIC_* in one File variable FRONTEND_ENV (scoped to aws_live).
    # Optional — individual NEXT_PUBLIC_* variables still work without it.
    - if [ -n "${FRONTEND_ENV:-}" ]; then set -a; eval "$(tr -d '\r' < "$FRONTEND_ENV")"; set +a; fi
    - docker build --pull
        --build-arg NEXT_PUBLIC_ENVIRONMENT="$NEXT_PUBLIC_ENVIRONMENT"
        --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL"
        --build-arg NEXT_PUBLIC_ADMIN_API_URL="$NEXT_PUBLIC_ADMIN_API_URL"
        --build-arg NEXT_PUBLIC_BILLING_API_URL="$NEXT_PUBLIC_BILLING_API_URL"
        --build-arg NEXT_PUBLIC_USAGE_API_URL="$NEXT_PUBLIC_USAGE_API_URL"
        --build-arg NEXT_PUBLIC_WS_URL="$NEXT_PUBLIC_WS_URL"
        --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL"
        --build-arg NEXT_PUBLIC_BASE_DOMAIN="$NEXT_PUBLIC_BASE_DOMAIN"
        --build-arg NEXT_PUBLIC_RAZORPAY_BYPASS_ENABLED="$NEXT_PUBLIC_RAZORPAY_BYPASS_ENABLED"
        --build-arg NEXT_PUBLIC_RAZORPAY_KEY_ID="$NEXT_PUBLIC_RAZORPAY_KEY_ID"
        --build-arg NEXT_PUBLIC_ENABLE_PROXY_INTEGRITY_VERIFICATION="$NEXT_PUBLIC_ENABLE_PROXY_INTEGRITY_VERIFICATION"
        -t "$ECR_REGISTRY/$AWS_ECR_REPO:$CI_COMMIT_SHORT_SHA" .

"Push to ECR":
  extends: .aws-live
  stage: push
  before_script: *aws-cli
  script:
    - aws ecr describe-repositories --repository-names "$AWS_ECR_REPO" >/dev/null 2>&1
        || aws ecr create-repository --repository-name "$AWS_ECR_REPO" >/dev/null
    # a group/instance-level DOCKER_AUTH_CONFIG would override the ECR login
    - unset DOCKER_AUTH_CONFIG
    - aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - docker push "$ECR_REGISTRY/$AWS_ECR_REPO:$CI_COMMIT_SHORT_SHA"
    - docker logout "$ECR_REGISTRY"
    # pushed copy is the one that matters; free the runner's disk
    - docker image rm "$ECR_REGISTRY/$AWS_ECR_REPO:$CI_COMMIT_SHORT_SHA"
    - docker image prune -f

"Deploy":
  extends: .aws-live
  stage: deploy
  resource_group: aws-live-frontend   # one deploy at a time
  environment:
    name: aws_live
  before_script:
    - *aws-cli
    - *ssh
  after_script:
    - rm -f "$AWS_SSH_KEY.pem"
  script:
    - scp $SSH_OPTS docker-compose.yml "$SSH_TARGET:$AWS_DEPLOY_DIR/docker-compose.yml"
    - aws ecr get-login-password
        | ssh $SSH_OPTS "$SSH_TARGET" "docker login --username AWS --password-stdin $ECR_REGISTRY"
    - ssh $SSH_OPTS "$SSH_TARGET" bash -s -- deploy "$AWS_DEPLOY_DIR" FRONTEND_IMAGE
        "$ECR_REGISTRY/$AWS_ECR_REPO:$CI_COMMIT_SHORT_SHA" < .gitlab/ci/aws-live-remote.sh

"Health check":
  extends: .aws-live
  stage: health check
  resource_group: aws-live-frontend
  before_script: *ssh
  after_script:
    - rm -f "$AWS_SSH_KEY.pem"
  script:
    - ssh $SSH_OPTS "$SSH_TARGET" bash -s -- health "$AWS_DEPLOY_DIR"
        http://localhost:3000/ 24 < .gitlab/ci/aws-live-remote.sh
